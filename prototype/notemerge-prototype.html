<!doctype html>
<!--
  PROTOTYPE — THROWAWAY. Delete me once a variant wins.

  Question: what should NoteMerge look like end to end (write → sources → check → review → export)
  with a very simple UI and as few clicks as possible, without losing any behaviour in CONTEXT.md / docs/DESIGN.md?
  Reference draft: "NoteMerge Screens.html" (a vague idea, not final).

  (D, added later, = B up to the transcript check + C for review/export.)
  Three structurally different workflows on this one page, switched with ?variant= (or the bottom bar, or ← →):
    A  One page    — the note is the only canvas; sheet + rail appear in context, hover widgets do the review
    B  Focus flow  — one decision per full screen, keyboard first; flagged sentences and conflicts are card queues
    C  Dock        — note on the left, a permanent dock on the right holds every control; no modals, no screen changes

  Run:  open "prototype/notemerge-prototype.html?variant=A"      (no build, no server, no persistence)
  In-memory only. Transcription, merge, audio, Notion and PDF are all stubbed with timers.
  The bottom bar's "Jump" menu fills in sample files and skips ahead so each stage can be judged on its own.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NoteMerge — PROTOTYPE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C1C1A;--ink2:#4A4945;--mute:#6B6A65;--line:#ECEAE4;--line2:#DEDCD5;--line3:#CFCDC6;--side:#F4F3EF;--hover:#F7F6F2;--soft:#FAF9F5;
--green:#E4F2E1;--greenInk:#2F6A2B;--yel:#FFF1BF;--yelInk:#6A4E00;--yelLine:#8A6400}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:14px/1.4 Inter,system-ui,sans-serif;color:var(--ink);background:#fff;overflow:hidden}
#app{height:100vh;position:relative}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.muted{color:var(--mute)} .tiny{font-size:12px} .sm{font-size:13px} .grow{flex:1;min-width:0}
.row{display:flex;align-items:center} .col{display:flex;flex-direction:column} .between{justify-content:space-between}
.wrap{flex-wrap:wrap} .g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g16{gap:16px}.g20{gap:20px}
button{font:inherit;color:inherit;cursor:pointer}
.ic{display:inline-flex}
.btn{height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line3);background:#fff;font-weight:500;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}.btn.pri:hover{background:#000}
.btn.lg{height:44px;padding:0 22px;font-size:15px;border-radius:10px}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:6px}
.btn[disabled]{background:#E6E4DD;border-color:#E6E4DD;color:var(--mute);cursor:not-allowed}
.btn.ok{color:var(--greenInk);border-color:#B9D8B3;background:#F2F9F0}
.ghost{border:0;background:none;color:var(--ink2);font-size:13px;text-decoration:underline;text-underline-offset:2px;padding:0}
.ghost:hover{color:#000}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line3);background:#fff;font-weight:500;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)} .chip.dash{border-style:dashed;color:var(--ink2)}
.pill{font-size:13px;font-weight:600;padding:6px 10px;border-radius:6px}
.pill.y{color:var(--yelInk);background:var(--yel)} .pill.g{color:var(--greenInk);background:var(--green)}
input,select,textarea{font:inherit;height:32px;border:1px solid var(--line3);border-radius:6px;padding:0 10px;background:#fff;color:var(--ink);min-width:0}
textarea{height:auto;padding:10px 12px;resize:none}
input:focus,select:focus,textarea:focus,[contenteditable]:focus{outline:2px solid var(--ink);outline-offset:-1px}
.lbl{font-size:12px;font-weight:600;color:var(--mute)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;display:block}
.bar>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .1s}
.bar.ind>i{width:35%;animation:ind 1.1s ease-in-out infinite alternate}
@keyframes ind{from{margin-left:0}to{margin-left:65%}}
kbd{font:500 11px 'JetBrains Mono',monospace;border:1px solid var(--line3);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:#fff;color:var(--ink2)}
hr{border:0;border-top:1px solid var(--line)}

/* header + scroll */
.hd{height:60px;flex-shrink:0;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px}
.scroll{overflow:auto}
.ttl{font-weight:600;font-size:15px}

/* notes + merged doc */
.doc{font-size:15px;line-height:1.55;display:flex;flex-direction:column;gap:6px;width:680px;max-width:calc(100% - 48px);margin:0 auto}
.doc h1{font-size:26px;font-weight:700;margin-bottom:4px;line-height:1.25}
.ed:empty:before{content:attr(data-ph);color:#A8A69F;pointer-events:none}
.ed{outline:none;min-height:1.55em;white-space:pre-wrap}
.mk{display:flex;align-items:center;gap:10px;margin:12px 0 4px;color:var(--mute);font:500 12px 'JetBrains Mono',monospace}
.mk:before,.mk:after{content:"";flex:1;height:1px;background:var(--line2)}
.b{position:relative;padding:4px 10px;margin:0 -10px;border-radius:6px}
.b.add{background:var(--green)} .b.add.low{background:#F2F9F0;outline:1.5px dashed var(--greenInk);outline-offset:-1.5px}
.b.conf{background:var(--yel)} .b.conf.active{outline:2px solid var(--yelLine)}
.b.res{border-left:3px solid #E6D38A;border-radius:0 6px 6px 0}
.b.rev{color:var(--mute);text-decoration:line-through;background:var(--hover)}
.clean .b{background:none!important;outline:0!important;border-left:0!important}
.clean .b.rev{display:none}
.tag{font-size:11px;font-weight:600;color:var(--greenInk);margin-left:8px;white-space:nowrap}
.w{display:none;position:absolute;right:0;bottom:100%;padding-bottom:6px;z-index:6;cursor:default;text-decoration:none}
.b.below>.w{bottom:auto;top:100%;padding:6px 0 0}
.b:hover>.w,.b.open>.w{display:block}
.w>.in{background:#fff;border:1px solid var(--line2);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.16);font-size:13px;line-height:1.4;color:var(--ink)}
.w.wa>.in{background:var(--ink);color:#fff;border:0;border-radius:6px;padding:4px 6px 4px 10px;display:flex;gap:10px;align-items:center;font-size:12px;white-space:nowrap}
.w.wa .btn{height:22px;font-size:12px;padding:0 8px;background:transparent;color:#fff;border-color:#555}
.w.wc{width:410px}
.cw{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.src{display:flex;gap:10px;align-items:flex-start}
.rw{padding:10px 12px;background:var(--side);border-radius:8px;display:flex;flex-direction:column;gap:3px}
.play{width:30px;height:30px;flex-shrink:0;border-radius:99px;border:1px solid var(--line3);background:#fff;color:var(--ink);display:flex;align-items:center;justify-content:center}
.play.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.play.big{width:44px;height:44px;background:var(--ink);color:#fff;border-color:var(--ink)}
.play.sm{width:26px;height:26px}
.wa .play{width:22px;height:22px;background:transparent;color:#fff;border-color:#666}

/* forms */
.dz{border:1.5px dashed var(--line3);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
body.dragging .dz{border-color:var(--ink);background:var(--soft)}
.dz.big{padding:16px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--hover);border-radius:8px}
.dzhint{text-align:center;font-size:13px;color:var(--mute);padding:2px 0}
.stin{width:64px;height:30px;text-align:center;font:500 13px 'JetBrains Mono',monospace}
.stin.need{border:1.5px solid var(--ink)}
.x{border:0;background:none;color:var(--mute);width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:6px}

.wv{display:flex;align-items:center;gap:3px;height:96px;position:relative;cursor:pointer}
.wv i{width:3px;border-radius:2px;background:var(--line3)}.wv i.p{background:var(--ink)}
.wv u{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.mkb{text-align:left;display:flex;gap:12px;align-items:baseline;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:#fff;width:100%}
.mkb.on{border:1.5px solid var(--ink);background:var(--side)}
.mrow{display:grid;grid-template-columns:70px 100px minmax(0,1fr) 150px 64px;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);font-size:13px}
.mrow select{height:30px;font-size:12px;width:100%}

/* flagged sentences */
.fl{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft);cursor:pointer;display:flex;flex-direction:column;gap:6px}
.fl.open{background:#fff;border:1.5px solid var(--ink);cursor:default}
.fl.fixed{border-color:#B9D8B3}
.hl{background:var(--yel);border-bottom:2px dotted var(--yelLine)}
.finp{width:100%;height:34px;font-size:14px}

/* sidebar */
.side{width:232px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line2);display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow:auto}
.lec{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;font-size:13px;cursor:pointer}
.lec:hover{background:#ECEAE4}.lec.cur{background:#E6E4DD;font-weight:500}
.lec small{font-size:11px;color:var(--mute);white-space:nowrap}
.lec small.y{font-weight:600;color:var(--yelInk);background:var(--yel);padding:2px 6px;border-radius:4px}
.pop{position:absolute;z-index:30;background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.16);padding:8px;width:280px}
.scrim{position:fixed;inset:0;background:rgba(28,28,26,.4);z-index:40;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:860px;max-width:94vw;max-height:88vh;overflow:auto;padding:24px 28px}
.sheet{position:absolute;right:24px;top:68px;width:520px;max-height:calc(100% - 96px);background:#fff;border-radius:14px;border:1px solid var(--line2);box-shadow:0 20px 60px rgba(0,0,0,.22);display:flex;flex-direction:column;z-index:20}

/* prototype bar + toast */
#bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:100;background:#111;color:#fff;border-radius:999px;display:flex;align-items:center;gap:6px;padding:5px 8px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:12px}
#bar button,#bar select{background:transparent;border:0;color:#fff;height:26px;border-radius:99px;padding:0 9px;font-size:12px}
#bar button:hover{background:#333}#bar select{background:#222;border:1px solid #444;padding:0 6px}
#bar b{min-width:150px;text-align:center;font-weight:600}
#bar i{width:1px;height:16px;background:#444}
#toast{position:fixed;left:24px;bottom:18px;z-index:99;background:var(--ink);color:#fff;border-radius:8px;padding:9px 14px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.on{opacity:1}
.spin{width:14px;height:14px;border:2px solid var(--line3);border-top-color:var(--ink);border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}.eq i{width:2px;background:currentColor;animation:eq .6s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{from{height:3px}to{height:12px}}
</style>
</head>

<script>
/* ============================== tiny helpers ============================== */
const $ = (s, el = document) => el.querySelector(s);
function h(tag, a, ...kids) {

}
const IC = {

const toSec = t => { const p = t.split(':').map(Number); return p[0] * 3600 + p[1] * 60 + (p[2] || 0); };

/* ============================== mock data ============================== */
const SLIDE_T = { 1: 'Portada ATM', 2: 'Superficies articulares', 3: 'Disco articular', 4: 'Ligamentos', 5: 'Cápsula articular', 6: 'Lig. esfenomandibular', 7: 'Lig. estilomandibular' };
const slideTitle = n => SLIDE_T[n] || 'Slide ' + n;
const seedNotes = () => [
  { k: 'h', text: 'Tema 4 — Articulación temporomandibular' },
  { k: 'm', n: 1, time: '09:10:12' },
  { k: 'p', text: 'ATM: art. sinovial bicondílea, entre cóndilo mandibular y fosa glenoidea del temporal' },

/* the merged note (what the merge would return for the seeded notes) */
const MERGED = [
  { t: 'h', text: 'Tema 4 — Articulación temporomandibular' },

];

].map(f => ({ ...f, orig: f.text, fixed: false }));

/* ============================== state ============================== */
let V = new URLSearchParams(location.search).get('variant') || 'A';
const S = {};
let tick = null, alT = null, playT = null;
function reset() {
  clearInterval(tick); clearInterval(alT);
  Object.keys(S).forEach(k => delete S[k]);
  Object.assign(S, {
